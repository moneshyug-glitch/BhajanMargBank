name: Build Android TWA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Prepare Project
      run: |
        unzip -o BhajanMargBank.zip
        if [ -d "BhajanMargBank" ]; then
          cp -rf BhajanMargBank/* .
          cp -rf BhajanMargBank/.* . 2>/dev/null || true
        fi
        if [ -f "IntroActivity.kt" ]; then
          cp -f IntroActivity.kt app/src/main/java/com/bhajanmarg/app/IntroActivity.kt
        fi
        
        # 🎯 Android 13+ POST_NOTIFICATIONS परमिशन को AndroidManifest.xml में जोड़ना
        python3 -c '
        path = "app/src/main/AndroidManifest.xml"
        try:
            with open(path, "r") as f:
                s = f.read()
            if "POST_NOTIFICATIONS" not in s:
                idx = s.find("<application")
                if idx != -1:
                    perm = "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n"
                    s = s[:idx] + perm + s[idx:]
                    with open(path, "w") as f:
                        f.write(s)
                    print("✓ POST_NOTIFICATIONS permission added to AndroidManifest.xml!")
        except Exception as e:
            print("Manifest update error:", e)
        '
        chmod +x gradlew

    - name: Build Signed APK
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWA-Release-APK
        path: app/build/outputs/apk/release/*.apk
